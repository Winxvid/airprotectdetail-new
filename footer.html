<footer class="section-padding" id="footer" style="position: relative; overflow: hidden;">
    <video class="footer-video-bg" autoplay muted loop playsinline>
        <source src="{{BASE}}assets/Request_Consultation.mp4" type="video/mp4">
    </video>
    <div class="container">
        <div class="footer-content">
            <div class="contact-container">
                <div>
                    <h2 style="font-size: 3.5rem; background: linear-gradient(135deg, var(--clr-primary), var(--clr-text)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));">PRESERVE YOUR LEGACY</h2>
                    <p style="margin-top: 1rem; color: var(--clr-text-muted);">Provide your aircraft details
                        below. As a veteran-owned company, we approach every aircraft with discipline and
                        respect.</p>
                </div>
                <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
                    <input type="hidden" name="access_key" value="045c56e1-0f78-414b-9e7f-82f1e97cd12d">
                    <!-- Honeypot Spam Protection -->
                    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
                    
                    <input type="text" name="name" placeholder="Full Name" required>
                    <input type="email" name="email" placeholder="Email Address" required>
                    <input type="tel" name="phone" placeholder="Phone Number" required>
                    <input type="text" name="aircraft" placeholder="Aircraft Model (e.g. Cessna 172)">
                    <select name="service" required>
                        <option value="" disabled selected>Service Interested In *</option>
                        <optgroup label="Flightline Programs">
                            <option value="Flightline Standard">Flightline Standard</option>
                            <option value="Flightline Elite">Flightline Elite</option>
                            <option value="Flightline Command">Flightline Command</option>
                        </optgroup>
                        <optgroup label="Exterior Preservation">
                            <option value="Dry Wash">Dry Wash</option>
                            <option value="Wet Wash">Wet Wash</option>
                            <option value="Exterior Wax">Exterior Wax</option>
                            <option value="Brightwork Polishing">Brightwork Polishing</option>
                            <option value="Protective Coatings">Protective Coatings</option>
                            <option value="Window Restoration & Polishing">Window Restoration & Polishing</option>
                            <option value="De-Ice Boot Refurbishment">De-Ice Boot Refurbishment</option>
                            <option value="Paint Revitalization">Paint Revitalization</option>
                        </optgroup>
                        <optgroup label="Cabin Care">
                            <option value="Interior Cleaning & Detail">Interior Cleaning & Detail</option>
                            <option value="Leather Conditioning">Leather Conditioning</option>
                            <option value="Leather Repair & Re-Dye">Leather Repair & Re-Dye</option>
                            <option value="Stain Removal">Stain Removal</option>
                            <option value="Lavatory & Galley Sanitation">Lavatory & Galley Sanitation</option>
                            <option value="Carpet & Upholstery Extraction">Carpet & Upholstery Extraction</option>
                            <option value="Wood & Trim Polishing">Wood & Trim Polishing</option>
                            <option value="Dry Cleaning Carpet & Upholstery">Dry Cleaning Carpet & Upholstery</option>
                        </optgroup>
                        <optgroup label="Targeted Support">
                            <option value="Gear Well & Belly Cleaning">Gear Well & Belly Cleaning</option>
                            <option value="Oxidation Correction">Oxidation Correction</option>
                            <option value="Preservation Consultation">Preservation Consultation</option>
                        </optgroup>
                    </select>
                    <textarea name="message" placeholder="Additional Details" rows="4"></textarea>
                    <button type="submit" class="btn btn-primary submit-btn">
                        <span class="submit-btn__text">Send Request</span>
                        <span class="submit-btn__icon" aria-hidden="true">
                            <svg class="submit-btn__svg" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg" overflow="visible">
                                <path class="submit-btn__plane" d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
                                <line class="submit-btn__line submit-btn__line--1" x1="5" y1="15" x2="1" y2="19" stroke-width="1.5"/>
                                <line class="submit-btn__line submit-btn__line--2" x1="7" y1="17" x2="3" y2="21" stroke-width="1.5"/>
                                <line class="submit-btn__line submit-btn__line--3" x1="9" y1="19" x2="5" y2="23" stroke-width="1.5"/>
                            </svg>
                        </span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Footer bottom bar: socials + copyright left, veteran badge right -->
        <div class="footer-bottom">
            <div class="footer-bottom-left">
                <div class="social-links">
                    <a href="https://youtube.com/@airprotectgroup" target="_blank" aria-label="YouTube">
                        <i class="fab fa-youtube"></i>
                    </a>
                    <a href="https://www.facebook.com/airPROTECTdetailing" target="_blank" aria-label="Facebook">
                        <i class="fab fa-facebook"></i>
                    </a>
                    <a href="https://www.instagram.com/airprotectllc/" target="_blank" aria-label="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/tim-warner-jr-206b95381/" target="_blank" aria-label="LinkedIn">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </div>
                <span class="footer-divider"></span>
                <p class="footer-copyright">&copy; 2026 AirProtect. All rights reserved.</p>
            </div>
            <div class="footer-bottom-right">
                <img src="{{BASE}}assets/veteran.png" alt="Veteran Owned Business" class="veteran-badge" loading="lazy"
                    style="opacity: 0.85;">
            </div>
        </div>
    </div>
</footer>
