    <script>
        // Form submission via Web3Forms
        const form = document.querySelector('.contact-form');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Validate autocomplete fields — must have a selection, not just typed text
                const airportWrap   = document.querySelector('.airport-search-wrap');
                const aircraftWrap  = document.querySelector('.aircraft-search-wrap');
                const airportName   = document.getElementById('selected-airport-name');
                const aircraftVal   = document.getElementById('aircraft-hidden');
                let hasError = false;

                if (!airportName.value) {
                    airportWrap.classList.add('field-error');
                    document.getElementById('airport-input').placeholder = 'Please select an airport from the list *';
                    hasError = true;
                } else {
                    airportWrap.classList.remove('field-error');
                }

                if (!aircraftVal.value) {
                    aircraftWrap.classList.add('field-error');
                    document.getElementById('aircraft-input').placeholder = 'Please select an aircraft from the list *';
                    hasError = true;
                } else {
                    aircraftWrap.classList.remove('field-error');
                }

                if (hasError) return;

                const btn = form.querySelector('button');
                const originalText = btn.innerText;

                btn.innerText = 'Sending...';
                btn.style.pointerEvents = 'none';

                const formData = new FormData(form);

                try {
                    const response = await fetch('https://api.web3forms.com/submit', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();

                    if (result.success) {
                        btn.innerText = 'Request Sent!';
                        btn.style.background = '#00d084';
                        form.reset();
                        // Also clear the autocomplete visible inputs and hidden values
                        document.getElementById('airport-input').value = '';
                        document.getElementById('aircraft-input').value = '';
                        document.getElementById('selected-airport-name').value = '';
                        document.getElementById('selected-airport-code').value = '';
                        document.getElementById('aircraft-hidden').value = '';
                    } else {
                        btn.innerText = 'Error Sending';
                        btn.style.background = '#e74c3c';
                        console.log(result);
                    }
                } catch (error) {
                    btn.innerText = 'Error Sending';
                    btn.style.background = '#e74c3c';
                    console.log(error);
                }

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '';
                    btn.style.pointerEvents = 'auto';
                }, 4000);
            });
        }
    </script>
    <script>
        // Airport Autocomplete via Geoapify Search API
        (function() {
            const GEOAPIFY_KEY = "a76adb5f55ad483fa6d9ee59a105312a";
            const input = document.getElementById('airport-input');
            const resultsDiv = document.getElementById('airport-results');
            const hiddenName = document.getElementById('selected-airport-name');
            const hiddenCode = document.getElementById('selected-airport-code');
            let debounceTimer;

            input.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                const query = this.value.trim();
                if (query.length < 2) {
                    resultsDiv.classList.remove('active');
                    resultsDiv.innerHTML = '';
                    hiddenName.value = '';
                    hiddenCode.value = '';
                    return;
                }
                debounceTimer = setTimeout(() => fetchAirports(query), 300);
            });

            async function fetchAirports(query) {
                const url = `https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(query + ' airport')}&type=amenity&lang=en&limit=10&format=json&apiKey=${GEOAPIFY_KEY}`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    // Filter to only real airports (those with IATA or ICAO codes)
                    const airports = (data.results || []).filter(r => {
                        const names = r.other_names || {};
                        return names.iata || names.icao;
                    });
                    renderResults(airports);
                } catch (err) {
                    console.error('Airport search error:', err);
                }
            }

            function renderResults(results) {
                if (!results.length) {
                    resultsDiv.classList.remove('active');
                    resultsDiv.innerHTML = '';
                    return;
                }
                resultsDiv.innerHTML = results.map((r, i) => {
                    const name = r.name || r.formatted || '';
                    const names = r.other_names || {};
                    const code = names.iata || names.icao || '';
                    const city = r.city || '';
                    const state = r.state || '';
                    const location = [city, state].filter(Boolean).join(', ');
                    const display = code
                        ? `<span class="airport-code">${code}</span> &ndash; ${name}` + (location ? ` &ndash; ${location}` : '')
                        : name + (location ? ` &ndash; ${location}` : '');
                    return `<div class="airport-result-item" data-index="${i}" data-name="${name.replace(/"/g, '&quot;')}" data-code="${code}">${display}</div>`;
                }).join('');
                resultsDiv.classList.add('active');

                resultsDiv.querySelectorAll('.airport-result-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const name = this.dataset.name;
                        const code = this.dataset.code;
                        input.value = code ? `${code} \u2013 ${name}` : name;
                        hiddenName.value = name;
                        hiddenCode.value = code || 'N/A';
                        resultsDiv.classList.remove('active');
                        resultsDiv.innerHTML = '';
                    });
                });
            }

            // Close results when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.airport-search-wrap')) {
                    resultsDiv.classList.remove('active');
                }
            });
        })();
    </script>
    <script>
        // Aircraft Model Autocomplete via API Ninjas
        (function() {
            const NINJA_KEY = 'FeAFtc3zjxGeC5dZp4S8IbNF03nnat1jz0fl6NK6';
            const acInput = document.getElementById('aircraft-input');
            const acResults = document.getElementById('aircraft-results');
            const acHidden = document.getElementById('aircraft-hidden');
            let acTimer;

            acInput.addEventListener('input', function() {
                clearTimeout(acTimer);
                const query = this.value.trim();
                if (query.length < 3) {
                    acResults.classList.remove('active');
                    acResults.innerHTML = '';
                    return;
                }
                acTimer = setTimeout(() => fetchAircraft(query), 300);
            });

            async function fetchAircraft(query) {
                try {
                    // Search both manufacturer and model in parallel since
                    // the API treats them as separate exact-match fields
                    const [byMfr, byModel] = await Promise.all([
                        fetch(`https://api.api-ninjas.com/v1/aircraft?manufacturer=${encodeURIComponent(query)}&limit=10`, {
                            headers: { 'X-Api-Key': NINJA_KEY }
                        }).then(r => r.json()).catch(() => []),
                        fetch(`https://api.api-ninjas.com/v1/aircraft?model=${encodeURIComponent(query)}&limit=10`, {
                            headers: { 'X-Api-Key': NINJA_KEY }
                        }).then(r => r.json()).catch(() => [])
                    ]);
                    // Merge and deduplicate
                    const seen = new Set();
                    const combined = [];
                    [...byMfr, ...byModel].forEach(p => {
                        const key = `${p.manufacturer} ${p.model}`;
                        if (!seen.has(key)) { seen.add(key); combined.push(p); }
                    });
                    renderAircraft(combined);
                } catch (err) {
                    console.error('Aircraft search error:', err);
                }
            }

            function renderAircraft(planes) {
                if (!planes.length) {
                    acResults.classList.remove('active');
                    acResults.innerHTML = '';
                    return;
                }
                acResults.innerHTML = planes.map((p, i) => {
                    const label = `${p.manufacturer} ${p.model}`;
                    const engine = p.engine_type || 'N/A';
                    return `<div class="aircraft-result-item" data-index="${i}" data-value="${label.replace(/"/g, '&quot;')}">
                        <strong>${label}</strong>
                        <small>Engine: ${engine}</small>
                    </div>`;
                }).join('');
                acResults.classList.add('active');

                acResults.querySelectorAll('.aircraft-result-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const val = this.dataset.value;
                        acInput.value = val;
                        acHidden.value = val;
                        acResults.classList.remove('active');
                        acResults.innerHTML = '';
                    });
                });
            }

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.aircraft-search-wrap')) {
                    acResults.classList.remove('active');
                }
            });
        })();
    </script>
